name: wispcontrol_campo
description: "App de campo ID-Hub para técnicos y cobradores (secciones 23-27)."
publish_to: 'none'

# versionName+versionCode (Android) / CFBundleShortVersionString+CFBundleVersion (iOS)
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  provider: ^6.1.5+1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  signature: ^6.4.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
