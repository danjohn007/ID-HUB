# Compila el APK de la app de campo (mobile/campo) en GitHub.
# Avance y descarga: pestaña "Actions" del repositorio → "APK app de campo" → artefacto "idhub-campo-apk".
# Se ejecuta al hacer push con cambios en mobile/campo, o a mano con el botón "Run workflow".
name: APK app de campo

on:
  push:
    branches: [main]
    paths: ['mobile/campo/**', '.github/workflows/apk.yml']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Servidor de la API (vacío = el de lib/config.dart)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/campo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Misma versión con la que se desarrolla y compila localmente (la "stable" más nueva rompía el build).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar APK
        env:
          API_URL: ${{ github.event.inputs.api_url || vars.API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            flutter build apk --release --dart-define=API_URL="$API_URL"
          else
            flutter build apk --release
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: idhub-campo-apk
          path: mobile/campo/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
